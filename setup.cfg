# This file is used to configure your project.
# Read more about the various options under:
# http://setuptools.readthedocs.io/en/latest/setuptools.html#configuring-setup-using-setup-cfg-files

[metadata]
name = rbvfit
version = 2.4.0
description = Bayesian Voigt profile fitting for absorption line spectra with multi-system support
author = Rongmon Bordoloi
license = MIT
url = https://github.com/rongmon/rbvfit
long-description = file: README.md
long-description-content-type = text/markdown
platforms = any
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering :: Astronomy

[options]
zip_safe = False
packages = find:
include_package_data = True
package_dir =
    =src
# Core dependencies
# Same Python and bounds as rbcodes 3.x, so both install in one environment.
# Lower bounds: oldest releases with NumPy 2 / Python 3.12 support; upper bounds: next major version.
install_requires =
    numpy>=2.0,<3
    scipy>=1.13,<2
    matplotlib>=3.9,<4
    astropy>=6.1,<9
    emcee>=3.1,<4
    corner>=2.2,<3
    h5py>=3.11,<4
    pandas>=2.2.2,<4
    PyQt5>=5.15.10,<6
python_requires = >=3.12,<3.13

[options.package_data]
rbvfit =
    lines/*.dat
    lines/*.lst
    example-data/*

[options.packages.find]
where = src
exclude =
    tests

[options.extras_require]
# Optional dependencies
optional =
    ipywidgets>=8.0,<9
    linetools>=0.3.2,<0.4
    zeus-mcmc>=2.5,<3

[options.entry_points]
console_scripts =
    rbvfit_gui = rbvfit.gui.rbvfit_gui:main

[tool:pytest]
addopts = --verbose
testpaths = tests

[aliases]
build = bdist_wheel
release = build upload

[bdist_wheel]
universal = 1

[flake8]
exclude =
    .tox
    build
    dist
    .eggs
    docs

